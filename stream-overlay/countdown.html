<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCP Stream Countdown</title>
<style>
  /* ============================================================
     CONDITIONING CONTROL PANEL — Stream Countdown Overlay
     Transparent background. Drop into OBS as a Browser Source,
     or open in a browser. Everything is local & self-contained.
     ============================================================ */

  :root{
    --pink:#ff69b4;
    --hot:#ff2e97;
    --violet:#b76bff;
    --deep:#7b2ff7;
    --glow:#ff8ad4;
  }

  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:transparent;               /* fully transparent for OBS */
    overflow:hidden;
    font-family:'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none; cursor:none;
  }

  /* stage centers everything */
  .stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:2.2vh;
  }

  /* soft glow puddle behind the centerpiece for legibility over video */
  .halo{
    position:fixed; left:50%; top:38%;
    width:70vh; height:70vh; transform:translate(-50%,-50%);
    background:radial-gradient(circle at center,
        rgba(255,46,151,.28) 0%,
        rgba(183,107,255,.16) 35%,
        rgba(0,0,0,0) 66%);
    filter:blur(6px);
    pointer-events:none;
    animation:breathe 6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.75; transform:translate(-50%,-50%) scale(1);}
    50%    {opacity:1;   transform:translate(-50%,-50%) scale(1.06);}
  }

  /* ---- centerpiece: spiral + logo ---- */
  .center{
    position:relative;
    width:32vh; height:32vh;
    display:flex; align-items:center; justify-content:center;
    animation:float 5.5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%    {transform:translateY(-1.6vh);}
  }

  /* procedural hypno spiral, slowly spinning behind the logo */
  .spiral{
    position:absolute; left:50%; top:50%;
    width:46vh; height:46vh; transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg,
        rgba(255,105,180,.0) 0deg,
        rgba(255,105,180,.55) 8deg,
        rgba(183,107,255,.0) 20deg,
        rgba(123,47,247,.45) 34deg,
        rgba(255,46,151,.0) 48deg);
    -webkit-mask:radial-gradient(circle,#000 40%, rgba(0,0,0,.35) 62%, transparent 72%);
            mask:radial-gradient(circle,#000 40%, rgba(0,0,0,.35) 62%, transparent 72%);
    filter:blur(1px) saturate(1.3);
    opacity:.55;
    animation:spin 14s linear infinite;
    z-index:0;
  }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg);} }

  .logo{
    position:relative; z-index:2;
    width:100%; height:100%;
    object-fit:contain;
    filter:drop-shadow(0 0 18px rgba(255,46,151,.65))
           drop-shadow(0 0 40px rgba(183,107,255,.35));
    animation:logopulse 4s ease-in-out infinite;
  }
  @keyframes logopulse{
    0%,100%{filter:drop-shadow(0 0 16px rgba(255,46,151,.55)) drop-shadow(0 0 36px rgba(183,107,255,.30));}
    50%    {filter:drop-shadow(0 0 30px rgba(255,46,151,.95)) drop-shadow(0 0 64px rgba(183,107,255,.55));}
  }

  /* ---- text ---- */
  .kicker{
    font-size:3.4vh; letter-spacing:.55em; text-indent:.55em;
    font-weight:600; text-transform:uppercase;
    color:#ffd7ef;
    text-shadow:0 0 8px var(--hot), 0 0 22px var(--deep), 0 2px 4px rgba(0,0,0,.8);
    animation:flicker 5s infinite;
  }

  .count{
    font-size:16vh; line-height:.95; font-weight:800;
    letter-spacing:.03em;
    background:linear-gradient(180deg,#fff 0%, #ffd0ec 35%, var(--hot) 70%, var(--violet) 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 0 16px rgba(255,46,151,.85))
           drop-shadow(0 0 42px rgba(123,47,247,.55));
    font-variant-numeric:tabular-nums;
    animation:pop 1s ease-in-out infinite;
  }
  @keyframes pop{
    0%,100%{transform:scale(1);}
    50%    {transform:scale(1.015);}
  }

  .sub{
    font-size:2.4vh; letter-spacing:.35em; text-indent:.35em;
    text-transform:uppercase; font-weight:500;
    color:#e9c8ff;
    text-shadow:0 0 10px var(--deep), 0 2px 4px rgba(0,0,0,.8);
    opacity:.9;
  }

  @keyframes flicker{
    0%,19%,21%,23%,80%,100%{opacity:1;}
    20%,22%{opacity:.55;}
    81%{opacity:.7;}
  }

  /* LIVE state */
  .live .kicker,.live .sub{display:none;}
  .live .count{
    font-size:11vh; letter-spacing:.06em;
    animation:pop .8s ease-in-out infinite, hue 3s linear infinite;
  }
  @keyframes hue{ to{ filter:drop-shadow(0 0 24px rgba(255,46,151,1)) drop-shadow(0 0 60px rgba(123,47,247,.8)) hue-rotate(30deg);} }

  /* floating hearts */
  .hearts{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1;}
  .heart{
    position:absolute; bottom:-8vh; font-size:3vh;
    color:var(--pink); opacity:0;
    text-shadow:0 0 10px var(--hot);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%  {transform:translateY(0) rotate(0deg) scale(.7); opacity:0;}
    10% {opacity:.85;}
    90% {opacity:.6;}
    100%{transform:translateY(-118vh) rotate(220deg) scale(1.1); opacity:0;}
  }
</style>
</head>

<script>
/* ============================================================
   CONFIG — edit these, or override with URL query params.
   Examples:
     countdown.html?m=15            -> 15 minutes from load
     countdown.html?to=20:30        -> count to 8:30 PM (24h clock)
     countdown.html?m=10&title=Back%20in&sub=Grab%20a%20drink
   Refresh the OBS browser source (or the page) to restart.
   ============================================================ */
const CONFIG = {
  minutes: 15,          // countdown length in minutes from when the page opens
  targetClock: "",      // OR set like "20:30" (24h) to count to a wall-clock time; overrides `minutes`
  title: "Stream starting in",
  sub: "Good girls wait patiently",
  liveText: "WE'RE LIVE 💗",
  liveSub: "",          // shown under LIVE, optional
};

const qs = new URLSearchParams(location.search);
const cfg = {
  minutes:     qs.has('m')     ? parseFloat(qs.get('m')) : CONFIG.minutes,
  targetClock: qs.get('to')    ?? CONFIG.targetClock,
  title:       qs.get('title') ?? CONFIG.title,
  sub:         qs.get('sub')   ?? CONFIG.sub,
  liveText:    qs.get('live')  ?? CONFIG.liveText,
};

// resolve target end time
let end;
if (cfg.targetClock && /^\d{1,2}:\d{2}$/.test(cfg.targetClock)) {
  const [h,mn] = cfg.targetClock.split(':').map(Number);
  end = new Date();
  end.setHours(h, mn, 0, 0);
  if (end.getTime() <= Date.now()) end.setDate(end.getDate() + 1); // next day if already past
} else {
  end = new Date(Date.now() + Math.max(0, cfg.minutes) * 60000);
}

const $count  = document.getElementById('count');
const $kicker = document.getElementById('kicker');
const $sub    = document.getElementById('sub');
const $stage  = document.getElementById('stage');
$kicker.textContent = cfg.title;
$sub.textContent    = cfg.sub;

let live = false;
function tick(){
  const ms = end.getTime() - Date.now();
  if (ms <= 0){
    if (!live){
      live = true;
      $stage.classList.add('live');
      $count.textContent = cfg.liveText;
    }
    return;
  }
  const total = Math.floor(ms/1000);
  const h  = Math.floor(total/3600);
  const m  = Math.floor((total%3600)/60);
  const s  = total%60;
  const pad = n => String(n).padStart(2,'0');
  $count.textContent = h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
tick();
setInterval(tick, 250);

// floating hearts
const glyphs = ['💗','💖','🩷','✿','❀','♡'];
const hearts = document.getElementById('hearts');
function spawnHeart(){
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
  h.style.left = (Math.random()*100) + 'vw';
  h.style.fontSize = (2 + Math.random()*3) + 'vh';
  const dur = 7 + Math.random()*7;
  h.style.animationDuration = dur + 's';
  h.style.opacity = 1;
  hearts.appendChild(h);
  setTimeout(()=>h.remove(), dur*1000 + 500);
}
