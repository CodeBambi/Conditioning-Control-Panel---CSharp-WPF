# Diagnostic-only Windows probe for the flaky language persistence failure (run 35523716399:
# LanguageSelectorsRestoreAndDesktopExitFlushesPendingState, Language=fr expected, disk ja after
# 5007ms). It runs the EXACT existing test with every assertion, timing bound and the production
# 500ms debounce unchanged; the only added signal is the [lang-probe] log capture in the test's
# existing failure message. It does not gate anything and build.yml is untouched.
#
# Push-triggered on this probe branch only: workflow_dispatch would need the file registered on
# main first, which this branch is not.
name: language-probe

on:
  push:
    branches: [avalonia-port/probe-language-persistence]

jobs:
  windows-language-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # 8.0 runtime so the net8.0 testhost can launch; 10.0 SDK is what the repo builds with.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Effective environment
        shell: pwsh
        run: |
          Write-Host "[lang-probe] os=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host "[lang-probe] framework=$([System.Runtime.InteropServices.RuntimeInformation]::FrameworkDescription)"
          dotnet --info

      - name: Build language suite
        run: dotnet build Tests/CCP.Avalonia.Language.Tests/CCP.Avalonia.Language.Tests.csproj -c Release

      # Three serial attempts, each a fresh testhost process. Every outcome is preserved and the
      # job fails if ANY attempt failed: this is evidence gathering, never retry-until-green.
      - name: Run exact language test (3 serial attempts)
        id: probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/probe" | Out-Null
          $results = @()
          foreach ($i in 1..3) {
            Write-Host "[lang-probe] attempt $i"
            dotnet test Tests/CCP.Avalonia.Language.Tests/CCP.Avalonia.Language.Tests.csproj `
              -c Release --no-build `
              --filter "FullyQualifiedName~LanguageSelectorsRestoreAndDesktopExitFlushesPendingState" `
              --logger "trx;LogFileName=language-probe-$i.trx" `
              --results-directory "$env:RUNNER_TEMP/probe" 2>&1 |
              Tee-Object -FilePath "$env:RUNNER_TEMP/probe/attempt-$i.log"
            $code = $LASTEXITCODE
            Write-Host "[lang-probe] attempt $i exit=$code"
            $results += [pscustomobject]@{ attempt = $i; exitCode = $code }
          }
          $results | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/probe/attempts.json"
          $results | Format-Table | Out-String | Write-Host
          if ($results | Where-Object { $_.exitCode -ne 0 }) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-language-probe
          path: ${{ runner.temp }}/probe/
          if-no-files-found: warn
