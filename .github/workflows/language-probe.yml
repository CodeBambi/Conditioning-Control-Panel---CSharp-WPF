# Diagnostic-only Windows probe for the flaky language persistence failure (run 35523716399:
# LanguageSelectorsRestoreAndDesktopExitFlushesPendingState, Language=fr expected, disk ja after
# 5007ms). It runs the EXACT existing test with every assertion, timing bound and the production
# 500ms debounce unchanged; the only added signal is the [lang-probe] log capture in the test's
# existing failure message. It does not gate anything and build.yml is untouched.
#
# Push-triggered on this probe branch only: workflow_dispatch would need the file registered on
# main first, which this branch is not.
name: language-probe

on:
  push:
    branches: [avalonia-port/probe-language-persistence]

jobs:
  windows-language-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # 8.0 runtime so the net8.0 testhost can launch; 10.0 SDK is what the repo builds with.
          dotnet-version: |
            8.0.x
            10.0.x

      # Results directory exists before anything can fail, so the artifact survives a build break.
      - name: Effective environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/probe" | Out-Null
          # NOTE: this is the PowerShell host's framework and the INSTALLED tooling, not the
          # testhost runtime. The testhost's own runtime is recorded by the test process itself
          # into probe/testhost-runtime.log via CCP_PROBE_LOG_DIR.
          @(
            "[lang-probe] pwsh-host-os=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
            "[lang-probe] pwsh-host-framework=$([System.Runtime.InteropServices.RuntimeInformation]::FrameworkDescription)"
          ) | Tee-Object -FilePath "$env:RUNNER_TEMP/probe/environment.log"
          dotnet --info 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/probe/environment.log"

      - name: Build language suite
        shell: pwsh
        run: |
          dotnet build Tests/CCP.Avalonia.Language.Tests/CCP.Avalonia.Language.Tests.csproj -c Release 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/probe/build.log"
          exit $LASTEXITCODE

      # Three serial attempts, each a fresh testhost process. Every outcome is preserved and the
      # job fails if ANY attempt failed: this is evidence gathering, never retry-until-green.
      - name: Run exact language test (3 serial attempts)
        id: probe
        shell: pwsh
        env:
          # Makes every testhost process record its real runtime and owned profile, pass or fail.
          CCP_PROBE_LOG_DIR: ${{ runner.temp }}/probe
        run: |
          $codes = @()
          foreach ($i in 1..3) {
            Write-Host "[lang-probe] attempt $i"
            # --blame-hang bounds a hung test instead of burning the job timeout with no evidence.
            dotnet test Tests/CCP.Avalonia.Language.Tests/CCP.Avalonia.Language.Tests.csproj `
              -c Release --no-build `
              --filter "FullyQualifiedName~LanguageSelectorsRestoreAndDesktopExitFlushesPendingState" `
              --blame-hang --blame-hang-timeout 5m `
              --logger "trx;LogFileName=language-probe-$i.trx" `
              --results-directory "$env:RUNNER_TEMP/probe" 2>&1 |
              Tee-Object -FilePath "$env:RUNNER_TEMP/probe/attempt-$i.log"
            $code = $LASTEXITCODE
            Write-Host "[lang-probe] attempt $i exit=$code"
            # Flushed per attempt: an interrupted loop still keeps every outcome so far, and a
            # later pass can never erase an earlier failure.
            "{`"attempt`":$i,`"exitCode`":$code}" |
              Out-File -Append -Encoding utf8 "$env:RUNNER_TEMP/probe/attempts.jsonl"
            $codes += $code
          }
          Write-Host "[lang-probe] exit codes: $($codes -join ', ')"
          if ($codes | Where-Object { $_ -ne 0 }) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-language-probe
          path: ${{ runner.temp }}/probe/
          if-no-files-found: warn
