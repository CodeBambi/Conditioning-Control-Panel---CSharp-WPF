name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # THE ANTI-DRIFT JOB. Its entire value is that it runs on a machine where WPF cannot exist:
  # if CCP.Core ever grows a dependency on the Windows head, this job goes red the same day.
  # Do NOT add EnableWindowsTargeting here and do NOT build ConditioningControlPanel here -
  # either change makes the job pass on code that cannot run on Linux, which destroys the
  # only signal we have. The Windows build lives in the `windows` job below, on purpose.
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # 10.0 is what everything targets (LTS, supported to Nov 2028).
          dotnet-version: |
            10.0.x
      - run: dotnet build CCP.Core/CCP.Core.csproj -c Release
      # Core.Tests is the Linux-only behavior gate for the engine. Keep it separate from the
      # smoke runner so persistence/lifecycle regressions report as ordinary test failures.
      # The speech tests need the small Vosk model (~40 MB, not in the repo). Required here, so a
      # failed fetch fails the job instead of silently skipping the engine's only real proof.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccp-test/vosk
          key: vosk-model-small-en-us-0.15-30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498
      - run: bash .github/scripts/fetch-vosk-model.sh
      - run: dotnet test Tests/CCP.Core.Tests/CCP.Core.Tests.csproj -c Release
        env:
          CCP_REQUIRE_VOSK: "1"
      - name: Test Core settings publication (isolated profile)
        run: dotnet test Tests/CCP.Core.Settings.Tests/CCP.Core.Settings.Tests.csproj -c Release
      - name: Test release-content packs (loopback fake server, isolated profile)
        run: dotnet test Tests/CCP.Core.Content.Tests/CCP.Core.Content.Tests.csproj -c Release

      # Compiling for net10.0 proves the type system is satisfied. It does not prove the engine
      # BEHAVES off Windows. This step actually executes Core on Linux and asserts on the answers.
      #
      # It is not redundant with the build above, and it earned its place immediately: on its
      # first run it caught LogScrubber leaking the username out of crash.log on Linux, because
      # the scrubber only knew the C:\Users\ shape. Nothing else could have found that - the TFM
      # guard passed, the grep gate passed, and git recorded a 100% rename.
      #
      # Non-zero exit fails the job.
      - run: dotnet run --project CCP.LinuxSmoke/CCP.LinuxSmoke.csproj -c Release

      # The Linux head. --smoke proves it links against Core and can produce every value the
      # window renders; --render draws the REAL MainWindow offscreen through headless Skia and
      # writes a PNG, which is the only form of visual proof that survives on a runner with no
      # display server. Both exit non-zero on failure.
      # --smoke plays a clip through LibVLC (dummy output); Linux uses the system libvlc.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc-dev vlc-plugin-base
      - run: dotnet run --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --smoke
      # The shipped shape: the linux-x64 tarball (publish profile + Vosk model + .desktop + icon) that the
      # Flatpak manifest and the AUR PKGBUILD consume, extracted and smoked with the bundled model required.
      # A workflow artifact only - never a release.
      - name: Build the linux-x64 tarball and smoke it extracted
        run: |
          tar=$(bash packaging/linux/build-tarball.sh)
          bash packaging/linux/smoke-tarball.sh "$tar"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-tarball
          path: packaging/linux/out/*.tar.gz
          retention-days: 7
      # Consent runs in its own testhost: CorePaths is process-global and the headless Avalonia
      # lifetime must not share state with the language/notification/scheduler suites.
      - run: dotnet test Tests/CCP.Avalonia.Consent.Tests/CCP.Avalonia.Consent.Tests.csproj -c Release

      # The language, notification and scheduler suites stay separate: each command gets its own
      # testhost and each assembly owns its own process-immutable profile setup.
      - name: Test Avalonia language suite
        run: dotnet test Tests/CCP.Avalonia.Language.Tests/CCP.Avalonia.Language.Tests.csproj -c Release
      # This suite runs the real desktop startup failure branch against explicit temporary
      # Core/session roots, so it must keep its own testhost and process-global App state.
      - name: Test Avalonia catalogue startup fallback
        run: dotnet test Tests/CCP.Avalonia.CatalogueStartup.Tests/CCP.Avalonia.CatalogueStartup.Tests.csproj -c Release
      # Sharded: one testhost for the whole suite outgrew the 16 GB runner (see the script).
      - name: Test Avalonia notification suite
        run: bash .github/scripts/avalonia-tests-sharded.sh
        env:
          CCP_REQUIRE_VOSK: "1"
      - name: Test Avalonia scheduler gesture
        run: dotnet test Tests/CCP.Avalonia.Scheduler.Tests/CCP.Avalonia.Scheduler.Tests.csproj -c Release
      - name: Test Avalonia report workflow
        run: dotnet test Tests/CCP.Avalonia.Report.Tests/CCP.Avalonia.Report.Tests.csproj -c Release

      - name: Test Avalonia General settings picker (isolated profile)
        run: dotnet test Tests/CCP.Avalonia.GeneralSettings.Tests/CCP.Avalonia.GeneralSettings.Tests.csproj -c Release

      # The VR head. Builds and self-checks on ubuntu with no OpenXR runtime and no headset -
      # StereoKit ships natives for linux-x64/arm64 and android-arm64, so the same assembly
      # targets Steam Frame (SteamOS/ARM64) and Quest standalone. Rendering needs a device;
      # asserting it can produce every value it renders does not.
      - run: dotnet run --project CCP.VR/CCP.VR.csproj -c Release -- --smoke
      - run: dotnet run --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --render $RUNNER_TEMP/render/MainWindow.png
      # One PNG per ported view. A view that throws on construction fails the job; one that nulls
      # its own template or binds a missing property does NOT - Avalonia keeps bindings silent -
      # so the run prints every binding error per view and the PNGs are the proof. Read them.
      - run: dotnet run --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --render-all $RUNNER_TEMP/render
      # always(): the PNGs matter MOST when a view failed - a reviewer needs the 23 that drew.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-head-render
          path: ${{ runner.temp }}/render/

  # The "behaves identically on Windows" gate.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      # The -p: flag is required, not cosmetic. ConditioningControlPanel.csproj is SelfContained
      # + win-x64; ConditioningControlPanel.Tests sets a RID but NOT SelfContained and
      # ProjectReferences the app, which the .NET 10 SDK rejects with NETSDK1151 (the .NET 8 SDK
      # allowed it). Without a global.json the highest installed SDK wins, so the plain command
      # fails - verified on SDK 10.0.111. Suppressing the validation on the command line rather
      # than editing either .csproj keeps what ships byte-for-byte unchanged.
      # NOT -p:SelfContained=true: that also works for the app, but it is a global property, so
      # it hits CCP.Core.Tests too, which has no RuntimeIdentifier by design - that combination
      # fails with NETSDK1191 ("a runtime identifier for the property 'SelfContained' couldn't
      # be inferred"). Verified both ways.
      # Drop the flag if the solution ever builds clean without it.
      - name: Build solution (hard gate)
        run: dotnet build ConditioningControlPanel.sln -c Release -p:ValidateExecutableReferencesMatchSelfContained=false
      # HARD GATE. This started advisory - the suite is 254 files including WpfRenderHarness.cs
      # and PlayDoorRenderTests.cs, which do real WPF rendering, and nobody had confirmed it
      # green on a headless runner. The first CI run settled it: 4924 passed, 0 failed, in 45s,
      # render tests included. Promoted on that one green run, deliberately - an advisory job
      # that is always green trains everyone to ignore it. If it turns out flaky, demote it with
      # evidence (link the failing runs) rather than pre-emptively.
      - name: Test app suite
        run: dotnet test Tests/ConditioningControlPanel.Tests/ConditioningControlPanel.Tests.csproj -c Release -p:ValidateExecutableReferencesMatchSelfContained=false
      - name: Test Core suite
        run: dotnet test Tests/CCP.Core.Tests/CCP.Core.Tests.csproj -c Release
      - name: Test Core settings publication (isolated profile)
        run: dotnet test Tests/CCP.Core.Settings.Tests/CCP.Core.Settings.Tests.csproj -c Release
      - name: Test release-content packs (loopback fake server, isolated profile)
        run: dotnet test Tests/CCP.Core.Content.Tests/CCP.Core.Content.Tests.csproj -c Release
      # Keep these as separate invocations: the language, notification and scheduler assemblies
      # need independent testhost processes and isolated process-immutable profiles.
      - name: Test Avalonia language suite
        run: dotnet test Tests/CCP.Avalonia.Language.Tests/CCP.Avalonia.Language.Tests.csproj -c Release
      - name: Test Avalonia catalogue startup fallback
        run: dotnet test Tests/CCP.Avalonia.CatalogueStartup.Tests/CCP.Avalonia.CatalogueStartup.Tests.csproj -c Release
      - name: Test Avalonia notification suite
        run: dotnet test Tests/CCP.Avalonia.Tests/CCP.Avalonia.Tests.csproj -c Release
      - name: Test Avalonia scheduler gesture
        run: dotnet test Tests/CCP.Avalonia.Scheduler.Tests/CCP.Avalonia.Scheduler.Tests.csproj -c Release
      - name: Test Avalonia report workflow
        run: dotnet test Tests/CCP.Avalonia.Report.Tests/CCP.Avalonia.Report.Tests.csproj -c Release
      - name: Test Avalonia consent flow
        run: dotnet test Tests/CCP.Avalonia.Consent.Tests/CCP.Avalonia.Consent.Tests.csproj -c Release
      - name: Test Avalonia General settings picker (isolated profile)
        run: dotnet test Tests/CCP.Avalonia.GeneralSettings.Tests/CCP.Avalonia.GeneralSettings.Tests.csproj -c Release
      # The only place the Win32 overlay shim (CCP.Avalonia/Platform/Win32Overlay.cs) runs: opens a
      # click-through topmost overlay per screen and reads ex-style bits, visibility and rect back
      # from user32. Prints SKIP and exits 0 when the runner has no desktop session.
      # ADVISORY until its first green run (same rule as the app suite above): the shim has never
      # executed anywhere yet. Drop continue-on-error once a run is green.
      - name: Avalonia overlay check (Win32 shim)
        continue-on-error: true
        timeout-minutes: 5
        run: dotnet run --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --overlay-check
      # The installer's input (Properties/PublishProfiles/win-x64.pubxml, WPF's settings). WinExe has no
      # console, so Start-Process -Wait is what makes the exit code reach the step.
      - name: Publish win-x64 and smoke the published exe
        timeout-minutes: 20
        run: |
          dotnet publish CCP.Avalonia/CCP.Avalonia.csproj -c Release -p:PublishProfile=win-x64
          # WinExe has no console: capture the smoke's own report, or a failure says only "exited 1".
          $p = Start-Process -FilePath CCP.Avalonia\bin\publish\win-x64\CCP.Avalonia.exe -ArgumentList '--smoke' -Wait -PassThru -NoNewWindow -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Get-Content smoke.out, smoke.err
          if ($p.ExitCode -ne 0) { throw "--smoke exited $($p.ExitCode)" }

  # build-content-packs.ps1 is Windows-only (\\?\ long paths), so its proof runs here.
  # (a) The committed install-relative [InstallDelete] list must regenerate unchanged.
  # (b) Today's script on the Assets-move commit must zip byte-for-byte what the old script zipped
  #     on its parent. .ccpmod files are LFS pointers on both sides (no LFS pull), so those three
  #     zips prove the entry layout, not the archive bytes.
  # Greps the compiler cannot do: APIs that compile fine in a net10.0 library and only fail at
  # runtime, plus the XAML clr-namespace tripwire. See the script for what and why.
  core-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/core-guards.sh
