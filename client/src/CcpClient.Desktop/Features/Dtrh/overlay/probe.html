<!doctype html>
<!-- SP-023 product transport probe (NEW overlay path — never shadows a payload file).
     Imports the PRODUCT bridge.js derivative and proves the admitted transport matrix
     (dtrh-admission.md §3.2) on whichever engine hosts it:
       check1  which JS host objects exist;
       check2  page->host raw transports raise the host's WebMessageReceived;
       check3  host->page delivery through bridge.on (Windows: synthetic dispatch;
               Linux: long-poll inbox) incl. preBuffer replay on late registration.
     Every line is mirrored via bridge.log so the host sees results WITHOUT
     InvokeScript (NativeWebDialog GTK backend constraint, SP-011 L7). -->
<meta charset="utf-8">
<title>PROBING</title>
<pre id="out">PROBING</pre>
<script type="module">
const out = document.getElementById('out');
const lines = [];
let bridge = null;
const rec = (s) => {
  lines.push(s);
  out.textContent = lines.join('\n');
  if (bridge) bridge.log('probe: ' + s);
};

rec('check1 window.chrome.webview: ' + ((window.chrome && window.chrome.webview) ? 'PRESENT' : 'ABSENT'));
rec('check1b invokeCSharpAction: ' + (typeof window.invokeCSharpAction));

try {
  bridge = await import('./bridge.js');
  rec('bridge.js imported (product derivative, blob 13af3f4d + §3.1 diff); isHosted=' + bridge.isHosted);
} catch (e) {
  rec('bridge.js import FAILED: ' + (e && e.message));
}

if (window.chrome && window.chrome.webview) {
  window.chrome.webview.postMessage({ type: 'probe-p2h-native', note: 'native window.chrome.webview.postMessage' });
  rec('sent probe-p2h-native');
}
if (typeof window.invokeCSharpAction === 'function') {
  window.invokeCSharpAction(JSON.stringify({ type: 'probe-p2h-ica', note: 'invokeCSharpAction path' }));
  rec('sent probe-p2h-ica');
}

if (bridge) {
  bridge.on('probe-h2p', (m) => {
    rec('check3 host->page DELIVERED via bridge.on: ' + JSON.stringify(m));
    document.title = 'PROBE-DONE';
  });
  rec('bridge.on(probe-h2p) registered; awaiting host send');
  // SP-026 b4: served-media display proof — the host sends probe-img messages carrying
  // SERVED loopback URLs (Loom spirals / user media) and the probe renders them in the
  // SAME engine that renders the game (pixel-verifiable serving evidence, harness-only).
  bridge.on('probe-img', (m) => {
    if (!m || !m.url) return;
    const el = document.createElement(m.kind === 'video' ? 'video' : 'img');
    el.src = m.url;
    if (m.kind === 'video') { el.muted = true; el.autoplay = true; el.loop = true; }
    el.style.cssText = 'max-width:30vw;max-height:30vh;margin:4px;border:2px solid #ff5fa2';
    document.body.appendChild(el);
    el.onerror = () => rec('probe-img LOAD ERROR (' + (m.kind || 'image') + ')');
    rec('probe-img rendered ' + (m.kind || 'image') + ' (' + m.url.length + '-char url)');
  });
  // preBuffer check: the host sends probe-buffered BEFORE this delayed registration;
  // the bridge must buffer it and replay on on() (ordering contract).
  setTimeout(() => {
    bridge.on('probe-buffered', (m) => {
      rec('preBuffer REPLAY delivered on late registration: ' + JSON.stringify(m));
    });
    rec('late handler registered for probe-buffered (after host send)');
  }, 4000);
}
rec('probe module complete');

// SP-053 reduced-motion inheritance probe: evaluate the EXACT query the page's own
// capability probe uses (payload shared/capability.js:35 — READ-ONLY) inside whichever
// engine hosts this page, and report page->host as typed probe-motion messages (the
// host logs probe-* UnknownTypes verbatim AND re-reads the OS state at each arrival to
// pair the verdict). phase 'initial' at module eval; a MediaQueryList 'change' listener
// re-posts phase 'change' so a live OS toggle is captured if the engine tracks it
// (absence of a live flip proves nothing — two-run protocol is the primary evidence).
(function () {
  const QUERY = '(prefers-reduced-motion: reduce)';
  const report = (phase, mql) => {
    const reduced = !!(mql && mql.matches);
    const msg = { type: 'probe-motion', phase, query: QUERY, reduced };
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(msg);
    } else if (typeof window.invokeCSharpAction === 'function') {
      window.invokeCSharpAction(JSON.stringify(msg));
    }
    rec('probe-motion ' + phase + ': matchMedia ' + QUERY + ' -> reduced=' + reduced);
  };
  if (!window.matchMedia) {
    rec('probe-motion UNAVAILABLE: window.matchMedia absent');
    return;
  }
  const mql = window.matchMedia(QUERY);
  report('initial', mql);
  mql.addEventListener('change', (e) => report('change', e));
})();
</script>
