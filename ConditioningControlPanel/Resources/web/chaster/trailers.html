<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circe's trailers</title>
<!--
  THE TRAILERS. The vignette engine from the Circe's tab picker mockup (Sep 2026), shipped as
  Content and hosted by Controls/ChasterTrailerView inside the page's hover popup. One stage,
  one vignette at a time: the host calls window.__mount(id) (or opens ?v=id) and the scene loops
  until the next mount. The engine below is the saved mockup's four script blocks, verbatim.
  Nothing here talks to the network; there is no font link on purpose (system-ui stands in for
  Outfit) so the page is whole offline.
-->
<style>
  html,body{margin:0;padding:0;background:#120c1f;overflow:hidden;height:100%}
  body{display:block}
  #wrap{width:100%;border-radius:0}
  #wrap.stagewrap{border-radius:0}
</style>
</head>
<body>
<div id="wrap" class="stagewrap"></div>
<script>
/* Circe's Tab mockup: vignette framework. Every feature card owns a 320x200 logical stage.
   A vignette is CT.V.<id> = async function(s){ build with s.add(...), play with await s.to()/s.wait() }.
   The runner clears the stage and calls it again forever, and pauses it while the card is off screen. */
(function(){
var CT=window.CT={V:{},I:{},W:320,H:200};
CT.reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
CT.css=function(t){var s=document.createElement('style');s.textContent=t;document.head.appendChild(s)};
CT.icon=function(id,size){size=size||24;return '<svg class="ic" viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(CT.I[id]||'<circle cx="12" cy="12" r="7"/>')+'</svg>'};
CT.COL={add:'#ff3d71',sub:'#4dffc3',bet:'#ffcf6b',ink:'#f7f0ff',dim:'#a892cc'};
var DEAD={dead:1};
/* spiralPath(cx,cy,turns,rMax): svg path d for a smooth spiral from the centre outwards */
CT.spiralPath=function(cx,cy,turns,R){var d='',n=Math.round(turns*28);for(var i=0;i<=n;i++){var t=i/n,a=t*turns*6.2832,r=t*R;d+=(i?'L':'M')+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1)}return d};

CT.css(
'.stagewrap{position:relative;aspect-ratio:320/200;overflow:hidden;border-radius:18px;background:radial-gradient(120% 100% at 50% 0%,#2b1650,#130a24 75%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 -30px 60px -30px rgba(0,0,0,.6)}'+
'.stage{position:absolute;left:0;top:0;width:320px;height:200px;transform-origin:0 0;font-family:Outfit,system-ui,sans-serif;color:#f7f0ff;overflow:hidden}'+
'.stage *{box-sizing:border-box}'+
'.stage .abs{position:absolute}'+
/* shared look */
'.p-panel{position:absolute;border-radius:10px;background:linear-gradient(160deg,#3a2163,#22123d);box-shadow:0 0 0 1.5px rgba(255,255,255,.14),0 8px 20px -8px #000}'+
'.p-screen{position:absolute;border-radius:8px;background:#0e0719;box-shadow:0 0 0 2.5px #4a2d7a,0 0 0 4px #1a0e2d,0 10px 24px -8px #000;overflow:hidden}'+
'.p-stand{position:absolute;height:9px;width:26px;background:#4a2d7a;border-radius:0 0 4px 4px}'+
'.p-foot{position:absolute;height:4px;width:46px;background:#4a2d7a;border-radius:3px}'+
'.p-btn{position:absolute;border-radius:7px;background:linear-gradient(#ff5d9e,#c2267a);box-shadow:0 2px 0 #7d1650;font-weight:900;font-size:9px;letter-spacing:.08em;display:grid;place-items:center;color:#fff}'+
'.p-txt{position:absolute;font-weight:700;font-size:10px;letter-spacing:.08em;color:#a892cc;white-space:nowrap}'+
'.p-num{position:absolute;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}'+
'.p-line{position:absolute;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}'+
'.p-bar{position:absolute;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}'+
'.p-bar>i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:linear-gradient(90deg,#7a3cff,#ff4fa3)}'+
'.p-bar.g>i{background:linear-gradient(90deg,#1fae86,#4dffc3)}'+
/* the signature number */
'.cost{position:absolute;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;transform:translate(-50%,-50%);z-index:9;pointer-events:none;letter-spacing:.01em}'+
'.cost.add{color:#ff3d71;text-shadow:0 0 12px rgba(255,61,113,.9),0 0 2px #fff4}'+
'.cost.sub{color:#4dffc3;text-shadow:0 0 12px rgba(77,255,195,.8)}'+
'.cost.bet{color:#ffcf6b;text-shadow:0 0 12px rgba(255,207,107,.8)}'+
'.mark{position:absolute;transform:translate(-50%,-50%);z-index:8;pointer-events:none}'+
'.mark circle{stroke-dasharray:101;stroke-dashoffset:101;animation:ctdraw .35s ease-out forwards}'+
'.mark path{stroke-dasharray:40;stroke-dashoffset:40;animation:ctdraw .3s .2s ease-out forwards}'+
'@keyframes ctdraw{to{stroke-dashoffset:0}}'+
'.sparkle{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;pointer-events:none;z-index:9;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}'+
'.ring{position:absolute;border-radius:50%;border:2px solid #fff;pointer-events:none;transform:translate(-50%,-50%)}'+
'.cur{position:absolute;z-index:10;pointer-events:none;filter:drop-shadow(0 2px 3px #000a)}'
);

function Stage(wrap,id){
  this.id=id;this.wrap=wrap;this.visible=false;this.dead=false;
  this.root=document.createElement('div');this.root.className='stage';wrap.appendChild(this.root);
  var st=this;function fit(){st.root.style.transform='scale('+(wrap.clientWidth/CT.W)+')'}
  fit();if('ResizeObserver'in window)new ResizeObserver(fit).observe(wrap);else addEventListener('resize',fit);
  if('IntersectionObserver'in window)new IntersectionObserver(function(es){st.visible=es[0].isIntersecting},{rootMargin:'80px'}).observe(wrap);else this.visible=true;
}
Stage.prototype={
  reset:function(){this.root.textContent=''},
  /* add(html[,x,y]) appends one element (inline svg ok). With x,y it is absolutely placed at that top-left. */
  add:function(html,x,y){var t=document.createElement('template');t.innerHTML=html.trim();var n=t.content.firstElementChild;if(x!=null){n.style.position='absolute';n.style.left=x+'px';n.style.top=y+'px'}this.root.appendChild(n);return n},
  /* wait(ms): pauses while the card is off screen or the tab is hidden */
  wait:function(ms){var st=this;return new Promise(function(res,rej){var left=ms;(function tick(){if(st.dead)return rej(DEAD);if(!st.visible||document.hidden)return setTimeout(tick,250);var step=Math.min(left,120);setTimeout(function(){left-=step;if(left<=0)res();else tick()},step)})()})},
  /* anim(node,keyframes,opts|ms): raw WAAPI, resolves when done (never hangs) */
  anim:function(n,kf,o){if(typeof o==='number')o={duration:o};o=o||{};if(o.fill==null)o.fill='forwards';if(!o.easing)o.easing='cubic-bezier(.3,.7,.3,1)';var d=(o.duration||300)*(o.iterations||1)+(o.delay||0);return new Promise(function(res){var done=false,fin=function(){if(!done){done=true;res()}};try{var a=n.animate(kf,o);a.onfinish=fin;a.oncancel=fin}catch(e){fin()}setTimeout(fin,d+80)})},
  /* to(node,{x,y,s,r,o},ms[,easing]): tween translate/scale/rotate/opacity from the node's last state. x,y are offsets from where it was added. */
  to:function(n,p,ms,ease){var a=n._t||{x:0,y:0,s:1,r:0,o:n.style.opacity===''?1:+n.style.opacity},b={x:p.x==null?a.x:p.x,y:p.y==null?a.y:p.y,s:p.s==null?a.s:p.s,r:p.r==null?a.r:p.r,o:p.o==null?a.o:p.o};n._t=b;
    function tf(v){return'translate('+v.x+'px,'+v.y+'px) rotate('+v.r+'deg) scale('+v.s+')'}
    var pr=this.anim(n,[{transform:tf(a),opacity:a.o},{transform:tf(b),opacity:b.o}],{duration:ms||400,easing:ease||'cubic-bezier(.3,.7,.3,1)'});
    return pr.then(function(){n.style.transform=tf(b);n.style.opacity=b.o})},
  set:function(n,p){n._t={x:p.x||0,y:p.y||0,s:p.s==null?1:p.s,r:p.r||0,o:p.o==null?1:p.o};n.style.transform='translate('+n._t.x+'px,'+n._t.y+'px) rotate('+n._t.r+'deg) scale('+n._t.s+')';n.style.opacity=n._t.o;return n},
  /* cost(text,x,y,kind[,size]): THE flashing number. kind add (red) | sub (green) | bet (gold). x,y = its centre. Pops, flashes 3 times, stays. */
  cost:function(text,x,y,kind,size){var n=this.add('<div class="cost '+(kind||'add')+'"></div>');n.textContent=text;n.style.left=x+'px';n.style.top=y+'px';n.style.fontSize=(size||22)+'px';
    n.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:0},{transform:'translate(-50%,-50%) scale(1.35)',opacity:1,offset:.6},{transform:'translate(-50%,-50%) scale(1)',opacity:1}],{duration:260,easing:'cubic-bezier(.2,1.5,.4,1)'});
    n.animate([{opacity:1,filter:'brightness(1)'},{opacity:.15,filter:'brightness(2.5)'},{opacity:1,filter:'brightness(1)'}],{duration:170,iterations:3,delay:260});return n},
  /* floatAway(node): rise and fade, then remove */
  floatAway:function(n,ms){return this.anim(n,[{opacity:1,marginTop:'0px'},{opacity:0,marginTop:'-22px'}],{duration:ms||500,easing:'ease-in'}).then(function(){n.remove()})},
  check:function(x,y,size){size=size||34;var n=this.add('<svg class="mark" viewBox="0 0 36 36" width="'+size+'" height="'+size+'"><circle cx="18" cy="18" r="16" fill="rgba(77,255,195,.16)" stroke="#4dffc3" stroke-width="3"/><path d="M10 19l6 6 11-13" fill="none" stroke="#4dffc3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>');n.style.left=x+'px';n.style.top=y+'px';n.style.filter='drop-shadow(0 0 8px #4dffc3)';return n},
  cross:function(x,y,size){size=size||30;var n=this.add('<svg class="mark" viewBox="0 0 36 36" width="'+size+'" height="'+size+'"><path d="M9 9l18 18M27 9L9 27" fill="none" stroke="#ff3d71" stroke-width="5" stroke-linecap="round"/></svg>');n.style.left=x+'px';n.style.top=y+'px';n.style.filter='drop-shadow(0 0 8px #ff3d71)';n.querySelector('path').style.strokeDasharray=60;n.querySelector('path').style.strokeDashoffset=60;n.querySelector('path').style.animation='ctdraw .25s ease-out forwards';return n},
  spark:function(x,y,kind,count){var col=CT.COL[kind]||kind||'#fff';for(var i=0;i<(count||8);i++){var p=this.add('<i class="sparkle"></i>');p.style.left=x+'px';p.style.top=y+'px';p.style.background=i%3?col:'#fff';var a=Math.random()*6.283,d=14+Math.random()*26,sz=.5+Math.random()*.9;
      (function(p){p.animate([{transform:'translate(0,0) scale('+sz+') rotate(0deg)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) scale(0) rotate(140deg)',opacity:0}],{duration:450+Math.random()*350,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=function(){p.remove()}})(p)}},
  ripple:function(x,y,kind){var r=this.add('<i class="ring"></i>');r.style.left=x+'px';r.style.top=y+'px';r.style.borderColor=CT.COL[kind]||kind||'#fff';r.animate([{width:'4px',height:'4px',opacity:.9},{width:'44px',height:'44px',opacity:0}],{duration:450,easing:'ease-out'}).onfinish=function(){r.remove()}},
  shake:function(n,px){px=px||4;return this.anim(n,[{translate:'0 0'},{translate:-px+'px 0'},{translate:px+'px 0'},{translate:-px+'px 0'},{translate:px+'px 0'},{translate:'0 0'}],{duration:320,easing:'linear',fill:'none'})},
  flash:function(n,kind,times){var c=CT.COL[kind]||kind||'#fff';return this.anim(n,[{filter:'brightness(1) drop-shadow(0 0 0 '+c+')'},{filter:'brightness(1.9) drop-shadow(0 0 10px '+c+')'},{filter:'brightness(1) drop-shadow(0 0 0 '+c+')'}],{duration:200,iterations:times||2,fill:'none',easing:'linear'})},
  /* type(node,text,msPerChar): one span per char, resolves to the span array */
  type:async function(n,text,ms){var out=[];for(var i=0;i<text.length;i++){var c=document.createElement('span');c.textContent=text[i];c.style.display='inline-block';if(text[i]===' ')c.style.width='.35em';n.appendChild(c);out.push(c);await this.wait(ms||110)}return out},
  /* cursor(x,y): a drawn mouse pointer; move it with s.to(cur,{x:dx,y:dy},ms); click(cur) presses it */
  cursor:function(x,y){return this.add('<svg class="cur" viewBox="0 0 20 24" width="16" height="19"><path d="M2 2v17l4.5-4 3 7 3-1.4-3-6.8H16z" fill="#fff" stroke="#1a0e2d" stroke-width="1.6" stroke-linejoin="round"/></svg>',x,y)},
  click:async function(cur,kind){var t=cur._t||{x:0,y:0},x=parseFloat(cur.style.left)+t.x+2,y=parseFloat(cur.style.top)+t.y+2;this.ripple(x,y,kind||'#fff');await this.anim(cur,[{scale:'1'},{scale:'.78'},{scale:'1'}],{duration:180,fill:'none'})},
  /* screen(x,y,w,h): a little monitor with stand. Returns the inner screen div (position:absolute children, origin at its top-left). */
  screen:function(x,y,w,h){var sc=this.add('<div class="p-screen" style="width:'+w+'px;height:'+h+'px"></div>',x,y);this.add('<div class="p-stand"></div>',x+w/2-13,y+h+3);this.add('<div class="p-foot"></div>',x+w/2-23,y+h+11);return sc}
};

/* run(wrap,id): mounts a stage and loops its vignette forever */
CT.run=function(wrap,id){
  var s=new Stage(wrap,id);
  (async function(){
    while(!s.dead){
      try{s.reset();var fn=CT.V[id];if(!fn){s.add('<div class="abs" style="left:136px;top:76px;color:#a892cc;opacity:.5">'+CT.icon(id,48)+'</div>');await s.wait(4000);continue}
        await fn(s);await s.wait(700)}
      catch(e){if(e===DEAD)return;console.error('vignette '+id,e);try{await s.wait(3000)}catch(x){return}}
    }
  })();
  return s;
};
})();

</script>
<script>
/* Reference vignettes: remote_media, typo, misses. Copy this style. */
(function(){
var CT=window.CT,V=CT.V,I=CT.I;
I.remote_media='<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>';
I.remote_video='<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>';
I.typo='<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>';
I.lockcard='<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 12l3 3 5-6"/>';
I.misses='<path d="M12 21C5 15 3 11 3 8a4.5 4.5 0 0 1 9-1 4.5 4.5 0 0 1 9 1c0 3-2 7-9 13z"/><path d="M12 7l-2 4 3 2-2 4"/>';

CT.css(
'.vm-dash{stroke-dasharray:3 7;animation:vmdash .5s linear infinite}@keyframes vmdash{to{stroke-dashoffset:-10}}'+
'.vm-pol{position:absolute;width:26px;height:30px;margin:-15px 0 0 -13px;background:#fff;border-radius:2px;padding:3px 3px 0;box-shadow:0 4px 10px -2px #000,0 0 12px rgba(255,255,255,.5);z-index:6}'+
'.vm-pol i{display:block;height:19px;border-radius:1px}'+
'.vm-pol b{position:absolute;left:8px;top:7px;width:0;height:0;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;filter:drop-shadow(0 0 2px #0008)}'+
'.vm-th{position:absolute;width:20px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}'+
'.vm-total{position:absolute;left:50%;top:158px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;border-radius:14px;background:rgba(14,7,25,.8);box-shadow:0 0 0 1.5px rgba(255,61,113,.6);color:#ff3d71;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}'+
'.vm-card{position:absolute;left:46px;top:18px;width:228px;height:150px;border-radius:14px;background:linear-gradient(165deg,#3b2166,#1f1138);box-shadow:0 0 0 2px rgba(255,255,255,.16),0 14px 30px -10px #000;transition:box-shadow .3s}'+
'.vm-card.ok{box-shadow:0 0 0 2.5px #4dffc3,0 0 30px -4px #4dffc3}'+
'.vm-goal{position:absolute;left:0;right:0;top:38px;text-align:center;font-weight:900;font-size:17px;letter-spacing:.16em;color:rgba(255,255,255,.3)}'+
'.vm-input{position:absolute;left:18px;right:18px;top:78px;height:40px;border-radius:9px;background:#0e0719;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;letter-spacing:.14em;white-space:pre}'+
'.vm-caret{display:inline-block;width:2px;height:20px;background:#ff4fa3;margin-left:2px;animation:vmblink .7s steps(1) infinite}@keyframes vmblink{50%{opacity:0}}'+
'.vm-bad{color:#ff3d71;text-shadow:0 0 10px #ff3d71}'+
'.vm-bar{position:absolute;bottom:50px;width:22px;border-radius:5px 5px 0 0;background:linear-gradient(to top,#7a1cff,#ff3d71);transform-origin:bottom;transition:background .5s}'+
'.vm-cal{position:absolute;width:44px;height:46px;border-radius:7px;background:#fbf6ff;color:#1b0f2b;text-align:center;font-weight:900;font-size:24px;line-height:40px;padding-top:9px;box-shadow:0 6px 14px -6px #000;overflow:hidden}'+
'.vm-cal::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;background:#ff3d71}'
);

function bez(p0,p1,p2,n){var o=[];for(var i=0;i<=n;i++){var t=i/n,u=1-t;o.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]])}return o}
function fmt(sec){var a=Math.abs(sec),h=Math.floor(a/3600),m=Math.floor(a%3600/60),x=String(a%60).padStart(2,'0');return(sec<0?'−':'+')+(h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x)}

/* REMOTE: their PC sends sparkly polaroids down a dotted line to your PC. Each one that lands flashes +0:30. */
V.remote_media=async function(s){
  var L=s.screen(14,44,92,62),R=s.screen(214,44,92,62);
  s.add('<div class="p-txt">THEM</div>',46,124);s.add('<div class="p-txt">YOU</div>',250,124);
  s.add('<svg class="abs" style="left:0;top:0" width="320" height="200"><path class="vm-dash" d="M108 66 Q160 -6 212 66" fill="none" stroke="#a892cc" stroke-width="2.5" stroke-linecap="round"/></svg>');
  var grads=['linear-gradient(135deg,#ff7ab8,#7a3cff)','linear-gradient(135deg,#ffcf6b,#ff4fa3)','linear-gradient(135deg,#4dffc3,#7a3cff)'];
  grads.forEach(function(g,i){var t=document.createElement('i');t.className='vm-th';t.style.cssText='left:'+(8+i*27)+'px;top:8px;background:'+g;L.appendChild(t)});
  var btn=document.createElement('div');btn.className='p-btn';btn.style.cssText='left:22px;top:34px;width:48px;height:18px';btn.textContent='SEND';L.appendChild(btn);
  var pic=document.createElement('div');pic.style.cssText='position:absolute;inset:0;opacity:0';R.appendChild(pic);
  var total=s.add('<div class="vm-total">'+CT.icon('receipt',16)+'<span>0:00</span></div>');total.style.opacity=.35;
  var cur=s.cursor(70,120),sum=0,pts=bez([108,66],[160,-6],[212,66],10);
  for(var i=0;i<3;i++){
    var video=i===2;
    await s.to(cur,{x:-44+i*27,y:-64},380);await s.click(cur);
    await s.to(cur,{x:-12,y:-34},260);await s.click(cur,'add');s.flash(btn,'#fff',1);
    var p=s.add('<div class="vm-pol"><i style="background:'+grads[i]+'"></i>'+(video?'<b></b>':'')+'</div>');p.style.left='0px';p.style.top='0px';
    var kf=pts.map(function(q,k){return{transform:'translate('+q[0]+'px,'+q[1]+'px) rotate('+(-14+k*3)+'deg) scale('+(k===0?.4:1)+')'}});
    var trail=setInterval(function(){var r=p.getBoundingClientRect(),w=s.root.getBoundingClientRect(),k=CT.W/w.width;s.spark((r.left-w.left)*k+13,(r.top-w.top)*k+15,'#fff',1)},90);
    await s.anim(p,kf,{duration:900,easing:'cubic-bezier(.45,0,.4,1)'});clearInterval(trail);p.remove();
    pic.style.background=grads[i];s.anim(pic,[{opacity:0,filter:'brightness(3)'},{opacity:1,filter:'brightness(1)'}],300);s.spark(260,75,'add',10);
    sum+=video?120:30;var c=s.cost(video?'+2:00':'+0:30',260,22,'add',video?26:22);
    total.style.opacity=1;total.lastChild.textContent=fmt(sum).slice(1);s.anim(total,[{scale:'1'},{scale:'1.18'},{scale:'1'}],{duration:260,fill:'none'});
    await s.wait(850);s.floatAway(c);
  }
  s.flash(total,'add',3);await s.wait(1300);
};

/* TYPO: a lock card. One wrong letter: red, shakes, gets crossed out, +0:15. Finish the card clean: green check, time off. */
V.typo=async function(s){
  var card=s.add('<div class="vm-card"><svg class="abs" style="left:101px;top:10px" width="26" height="24" viewBox="0 0 26 24"><path d="M7 11V8a6 6 0 0 1 12 0v3" fill="none" stroke="#a892cc" stroke-width="2.5" stroke-linecap="round"/><rect x="4" y="10.5" width="18" height="12" rx="3" fill="#a892cc"/></svg><div class="vm-goal">DROP FOR ME</div><div class="vm-input"><span class="vm-typed"></span><i class="vm-caret"></i></div></div>');
  var typed=card.querySelector('.vm-typed'),input=card.querySelector('.vm-input');
  await s.wait(400);
  await s.type(typed,'DROP FO',120);
  var bad=(await s.type(typed,'E',120))[0];bad.className='vm-bad';
  var bx=46+input.offsetLeft+bad.offsetLeft+bad.offsetWidth/2,by=18+input.offsetTop+20;
  s.shake(bad,3);s.flash(input,'add',2);await s.wait(260);
  var x=s.cross(bx,by,30),c=s.cost('+0:15',bx+6,52,'add',26);s.shake(card,3);
  await s.wait(900);
  await s.anim(bad,[{scale:'1',opacity:1},{scale:'0',opacity:0}],180);bad.remove();x.remove();s.floatAway(c);
  await s.wait(200);
  await s.type(typed,'R ME',120);
  await s.wait(150);card.classList.add('ok');card.querySelector('.vm-caret').style.display='none';
  s.check(160,156,40);s.spark(160,156,'sub',12);
  await s.wait(350);s.cost('−0:30',232,156,'sub',24);
  await s.wait(1600);
};

/* AWAY: CCP sleeps, the days flip, the charge doubles. Come back and do a session: half of it melts. */
V.misses=async function(s){
  var scr=s.screen(18,26,76,52);scr.style.filter='brightness(.5)';
  var eye=document.createElement('div');eye.innerHTML='<svg width="76" height="52" viewBox="0 0 76 52"><path class="lid" d="M22 26q16 12 32 0" fill="none" stroke="#a892cc" stroke-width="3" stroke-linecap="round"/></svg>';scr.appendChild(eye);
  var cal=s.add('<div class="vm-cal">1</div>',34,104);
  s.add('<div class="abs" style="left:112px;right:14px;top:150px;border-top:2px dashed rgba(255,255,255,.2)"></div>');
  var total=s.add('<div class="p-num" style="right:16px;top:8px;font-size:22px;color:#ff3d71;text-shadow:0 0 12px rgba(255,61,113,.7)">+0:00</div>');
  var mins=[5,10,20,40,60,60],sum=0,bars=[],labels=[];
  for(var i=0;i<mins.length;i++){
    cal.textContent=i+1;s.anim(cal,[{transform:'rotateX(-80deg)'},{transform:'rotateX(0)'}],{duration:240,fill:'none'});
    var h=Math.round(mins[i]/60*84),b=s.add('<i class="vm-bar" style="left:'+(118+i*32)+'px;height:'+h+'px"></i>');bars.push(b);
    await s.anim(b,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:320,easing:'cubic-bezier(.2,1.5,.4,1)'});
    var l=s.add('<div class="p-num" style="left:'+(118+i*32)+'px;width:22px;text-align:center;top:'+(134-h)+'px;font-size:12px;color:#ff3d71">+'+mins[i]+'</div>');labels.push(l);
    sum+=mins[i]*60;total.textContent=fmt(sum);s.anim(total,[{scale:'1.25'},{scale:'1'}],{duration:220,fill:'none'});
    await s.wait(i<3?420:300);
  }
  s.flash(total,'add',3);await s.wait(900);
  /* they come back */
  scr.style.transition='filter .4s';scr.style.filter='brightness(1.15)';eye.remove();
  var sp=document.createElement('div');sp.innerHTML='<svg width="76" height="52" viewBox="0 0 76 52"><path d="'+CT.spiralPath(38,26,3,20)+'" fill="none" stroke="#ff7ab8" stroke-width="2.5" stroke-linecap="round"/></svg>';scr.appendChild(sp);
  sp.firstChild.style.transformOrigin='38px 26px';s.anim(sp.firstChild,[{rotate:'0deg'},{rotate:'720deg'}],{duration:1800,easing:'linear'});
  var bar=s.add('<div class="p-bar g" style="left:18px;top:160px;width:76px;height:8px"><i></i></div>');
  await s.anim(bar.firstChild,[{width:'0%'},{width:'100%'}],{duration:1500,easing:'linear'});
  s.check(56,52,34);s.spark(56,52,'sub',10);
  bars.forEach(function(b){b.style.background='linear-gradient(to top,#1fae86,#4dffc3)';s.anim(b,[{transform:'scaleY(1)'},{transform:'scaleY(.5)'}],{duration:600,easing:'cubic-bezier(.3,1.3,.5,1)'})});
  labels.forEach(function(l){l.remove()});
  await s.wait(300);s.cost('−'+fmt(sum/2).slice(1),208,60,'sub',24);
  total.style.color='#4dffc3';total.style.textShadow='0 0 12px rgba(77,255,195,.7)';total.textContent=fmt(sum/2);
  await s.wait(1800);
};
})();

function el(p,html){var t=document.createElement('template');t.innerHTML=html.trim();var n=t.content.firstElementChild;p.appendChild(n);return n}
function mmss(sec){sec=Math.round(sec);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}

/* ATTENTION: click the target before its ring drains. Miss it: +2:00 */

  [[14,14,60],[14,26,96],[14,38,44],[110,92,56],[110,80,34]].forEach(function(l){el(sc,'<div class="p-line" style="left:'+l[0]+'px;top:'+l[1]+'px;width:'+l[2]+'px"></div>')});

  var a=target(sc,52,66);s.anim(a,[{scale:'0'},{scale:'1'}],{duration:260,easing:POP});
  var ra=a.querySelector('.va-ring'),da=ra.animate([{strokeDashoffset:0},{strokeDashoffset:132}],{duration:1800,fill:'forwards'});
  await s.wait(300);
  await s.to(cur,{x:-112,y:-30},520);da.pause();await s.click(cur,'sub');
  var ck=s.check(122,84,34);s.spark(122,84,'sub',10);
  s.anim(a,[{scale:'1',opacity:1},{scale:'1.3',opacity:0}],260);
  await s.wait(750);a.remove();ck.remove();
  /* beat 2: looking elsewhere */
  s.to(cur,{x:-128,y:4},900,'ease-in-out');
  var b=target(sc,128,52);s.anim(b,[{scale:'0'},{scale:'1'}],{duration:260,easing:POP});
  await s.anim(b.querySelector('.va-ring'),[{strokeDashoffset:0},{strokeDashoffset:132}],{duration:1700,easing:'linear'});
  b.classList.add('bad');redFlash(s,sc);s.shake(b,4);s.flash(b,'add',2);

  await s.wait(1600);
};

  var eye=s.add('<svg class="abs" width="52" height="34" viewBox="0 0 52 34"><path class="lid" d="M6 17q20 13 40 0" fill="none" stroke="#a892cc" stroke-width="3" stroke-linecap="round"/><g class="op" style="opacity:0;transform-origin:26px 17px"><path d="M4 17q22-18 44 0q-22 18-44 0z" fill="#0e0719" stroke="#f7f0ff" stroke-width="2.5" stroke-linejoin="round"/><circle class="iris" cx="26" cy="17" r="7" fill="#ff4fa3"/><circle class="pup" cx="26" cy="17" r="2.8" fill="#0e0719"/></g></svg>',134,6);
