<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Arcademy</title>
    <!-- No favicon ships (the page is a webview); the empty data: href stops the
         browser's automatic /favicon.ico probe from logging ERR_FILE_NOT_FOUND. -->
    <link rel="icon" href="data:,">
    <!-- The in-app "Arcademy" page (T2 mini-game hub). Served by the WebView2
         ArcademyHostService from https://ccp.game/arcademy/. One document, ES
         modules, NO build step, NO frameworks, NO remote fonts (the webview is
         offline; the mockup's Google faces degrade to the system stacks in
         styles.css). The host owns consent and settings; the page owns the
         shell (timetable -> class -> report card) and asks for everything else
         over bridge.js. Portable to a phone/web host later: only bridge.js's
         transport changes. -->
    <link rel="stylesheet" href="./styles.css">
    <!-- EMI, the mascot. Two sheets on purpose: emi.css is the renderer's skin
         (agent A), widget.css is the floating/drag/dock half (agent B). Both are
         local files - trap 2, the webview is offline and there is no build step. -->
    <link rel="stylesheet" href="./emi/emi.css">
    <link rel="stylesheet" href="./emi/widget.css">
</head>
<body>
    <!-- Chrome: title, grade_tier chip, attendance chip, settings gear.
         Built by shell/shell.js; empty until init lands. -->
    <header id="arc-topbar" class="arc-topbar" hidden></header>

    <!-- The one screen mount: split-flap board, class runner, report card and
         the settings page all render here, one at a time (screen router). -->
    <main id="arc-screen" class="arc-screen" role="main"></main>

    <!-- Distraction Engine mount. Fixed, pointer-events:none by default so an
         effect can never steal a click from a precision board (input-trust law);
         an effect that WANTS clicks re-enables pointer events on its own node. -->
    <div id="arc-fx" class="arc-fx" aria-hidden="true"></div>

    <!-- Ceremony layer (stamps, streak meter, reward beats). Above the fx layer
         so a stamp is never washed out by its own celebration. -->
    <div id="arc-ceremony" class="arc-ceremony" aria-hidden="true"></div>

    <!-- EMI's layer. ABOVE the ceremony so her speech bubble is never washed out
         by a stamp beat, BELOW the toast so shell chatter still wins. Fixed and
         pointer-events:none; only `.emi` and `.emi-dock` take a click, so a board
         row under her footprint stays clickable (input-trust law). -->
    <div id="arc-emi" class="arc-emi" aria-hidden="false"></div>

    <!-- Transient shell chatter: Esc-ladder hints, "copied", suspend notices. -->
    <div id="arc-toast" class="arc-toast" role="status" aria-live="polite"></div>

    <!-- Loader: covers the page until init arrives and the board is dealt.
         Doubles as THE INTRO SPLASH (~3s): CRT power-on -> the wordmark THUD
         (Feel Dept stamp punch) -> the pixel tail flies home -> checker rail
         chase -> sparkle burst -> zoom-through exit. Pure CSS on a fixed
         timeline, starts at t0 with no init needed; if boot runs long the tail
         animations hold as an idle loop. boot.js's whole contract with this div
         is unchanged: the `hidden` attribute, plus the `is-done` class that
         plays the exit beat (failure paths snap `hidden` and skip the beat).
         Reduced motion collapses it to a static card (styles.css). -->
    <div id="arc-loader" class="arc-loader">
        <div class="arc-intro-burst" aria-hidden="true"></div>
        <div class="arc-intro-stage" aria-hidden="true">
            <span class="arc-intro-ring"></span>
            <img class="arc-intro-mark" src="./art/arcademy-wordmark.png" alt="" draggable="false">
            <span class="arc-intro-glint"></span>
            <span class="arc-intro-bit"></span><span class="arc-intro-bit"></span><span class="arc-intro-bit"></span><span class="arc-intro-bit"></span><span class="arc-intro-bit"></span><span class="arc-intro-bit"></span><span class="arc-intro-bit"></span><span class="arc-intro-bit"></span><span class="arc-intro-bit"></span><span class="arc-intro-bit"></span>
            <span class="arc-intro-spark"></span><span class="arc-intro-spark"></span><span class="arc-intro-spark"></span><span class="arc-intro-spark"></span><span class="arc-intro-spark"></span><span class="arc-intro-spark"></span>
        </div>
        <div class="arc-intro-rail" aria-hidden="true"></div>
        <p class="arc-intro-caption">Opening <span class="arc-loader-name">The Arcademy</span>&#8230;</p>
        <!-- THE DIRECT LAUNCH's door plate (boot.js dressDirectLaunch). Empty and
             hidden on every ordinary boot; a Discord per-class command fills the
             span with that class's own name and unhides it, so the splash the
             player is already watching says which room it is opening. -->
        <p class="arc-intro-class" hidden><span class="arc-intro-class-name"></span></p>
        <div class="arc-intro-scan" aria-hidden="true"></div>
        <div class="arc-intro-flash" aria-hidden="true"></div>
        <div class="arc-intro-crt" aria-hidden="true"></div>
    </div>

    <!-- Boot failure fallback (boot-error was posted; the host closes us). -->
    <div id="arc-nope" class="arc-nope" hidden>
        <h1>The Arcademy is closed</h1>
        <p id="arc-nope-msg">Something went wrong opening the school.</p>
        <p class="arc-nope-hint">Hold <kbd>Esc</kbd> to go back.</p>
    </div>

    <script type="module" src="./boot.js"></script>
</body>
</html>
