<!doctype html>
<html lang="en" class="arc-report-on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Records Office — room tester</title>
<!-- Standalone tester for shell/recordsroom.js. No shell, no bridge, no host.
     annex/demo.html's precedent: load the REAL shell sheet (the room's own
     recordsroom.css / scene.css / rooms.css link themselves lazily), build the
     real module under DOUBLE caps, and drive the views from the query string.

       ?view=wide|board|book   which slide is up (default wide)
       ?panel=cards            open the card-wall panel over the wide shot
       ?ajar=1                 the storeroom reveal has fired (door patch + rect)
       ?visits=0               first-ever visit (the 2s tray-only window)
       ?spread=N               which of the book's spreads is open (0-9)
       ?reduced=1              force the decoration cut (no fx layer at all)
       ?lite=1                 the performance rung (fx minus the canvas)
       ?forcemobile=1          core/device.js's override - the phone rules

     The store is core/store.js with NO bridge, which makes it exactly an
     in-memory get/set over a plain object - the same normalizer the shell
     hands the room, so the cards are the shape records.js/punchcard.js expect. -->
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #0B0B18; overflow: hidden; }
  /* a tiny corner stamp so a screenshot says which build it is */
  #rrdemo-tag { position: fixed; left: 6px; top: 4px; z-index: 999;
      font: 10px/1.4 ui-monospace, monospace; color: rgba(255,255,255,.34);
      letter-spacing: .12em; pointer-events: none; }
</style>
</head>
<body>
<div id="rrdemo-tag"></div>
<script type="module">
  import { createRecordsRoom } from './recordsroom.js';
  import { createStore } from '../core/store.js';
  import { t as lexT } from '../core/lexicon.js';
  import { loadFaceGeometry } from './punchcard.js';
  import { initCorkboard } from './corkboard.js';
  import { installDeviceClass } from '../core/device.js';

  /* THE PHONE GATE IS BOOT'S JOB and this page has no boot: without it
     `html.arc-mobile` never lands and a 844x390 shot renders the DESKTOP rules,
     which is exactly the blind spot CLAUDE.md section 6 exists to close.
     `?forcemobile=1` still decides - this only makes the answer land. */
  installDeviceClass();

  const q = new URLSearchParams(location.search);
  const wanted = (q.get('view') || 'wide').toLowerCase();
  const wantCards = q.has('panel') && q.get('panel') === 'cards';
  const ajar = q.get('ajar') === '1';
  const visitsParam = q.has('visits') ? Number(q.get('visits')) : 4;
  const spreadParam = q.has('spread') ? Number(q.get('spread')) : 0;
  const reduced = q.get('reduced') === '1';
  const lite = q.get('lite') === '1';
  /* The shell paints this class; a page with no shell has to paint it itself,
     or `?reduced=1` would only reach the room's own `reduced` cap and none of
     the sheets that read `html.arc-reduced`. */
  if (reduced) { try { document.documentElement.classList.add('arc-reduced'); } catch (e) {} }

  const log = (m) => { try { console.log('[rr-demo] ' + m); } catch (e) {} };

  /* ---------------------------------------------------------------- the day */
  const DAY = '2026-08-25';
  const d = (n) => '2026-08-' + String(n).padStart(2, '0');

  /* ------------------------------------------------------- the fake blob ----
   * `punchCards` in the host's own shape (core/store.js header): per class
   * {punches, dates[], sDates[], enrolledAt, unlockedAt}. store.punchCard
   * recomputes `punches` from enrolledAt(3) + dates + sDates, so the numbers
   * below are only ever the raw ingredients. A spread on purpose: one complete
   * card, a couple mid-way, one enrolled-only, and five never touched (an
   * unattended card on the wall IS the advertisement). */
  const punchCards = {
    daily_trigger:   { enrolledAt: d(10), dates: [d(11), d(12), d(14), d(15), d(17), d(19), d(21)], sDates: [d(12), d(19)], unlockedAt: d(21) },
    lost_and_found:  { enrolledAt: d(13), dates: [d(16), d(18), d(22)], sDates: [d(18)] },
    sort:            { enrolledAt: d(12), dates: [d(15), d(16), d(20), d(23), d(24)], sDates: [] },
    deja_vu:         { enrolledAt: d(20), dates: [d(23)], sDates: [] },
    impulse_control: { enrolledAt: d(24), dates: [], sDates: [] },
  };

  const store = createStore({
    initialMeta: {
      punchCards,
      recordsRoomVisits: isFinite(visitsParam) ? visitsParam : 4,
      /* Deliberately BEHIND the live total, so the tray wears the pink tab. */
      recordsRoomSeenStamps: 12,
      recordsBookPage: isFinite(spreadParam) ? spreadParam : 0,
      annexRevealSeen: ajar,
    },
    log,
  });

  /* Registry order, every registered class (art/punchcard/faces.json is the
   * art manifest and its key order is the shipped set). */
  const GAME_KEYS = [
    'daily_trigger', 'lost_and_found', 'deja_vu', 'impulse_control', 'sort',
    'echo', 'instant_recall', 'anomaly', 'composure', 'the_deep_end',
  ];
  const gameName = (k) => lexT('game_' + k, String(k).replace(/_/g, ' '));
  const totalStamps = () => GAME_KEYS.reduce((n, k) => n + (store.punchCard(k).punches || 0), 0);

  /* The cork's injected persistence: a throwaway object + a no-op save. */
  initCorkboard({
    state: { notices: {} },
    save: () => {},
    daySeed: DAY,
    log,
    when: () => true,      // every gated notice eligible, so the wall is full
  });

  /* The face geometry, so the cards draw on their art instead of the floor. */
  loadFaceGeometry(log);

  const room = createRecordsRoom({
    mount: document.body,
    t: lexT,
    log,
    lite,
    reduced,
    gameKeys: GAME_KEYS,
    gameName,
    punchCard: (k) => store.punchCard(k),
    stampTotal: totalStamps,
    seenStamps: () => Number(store.get('recordsRoomSeenStamps')) || 0,
    markSeen: (n) => store.set('recordsRoomSeenStamps', n),
    visits: () => Number(store.get('recordsRoomVisits')) || 0,
    markVisit: (n) => store.set('recordsRoomVisits', n),
    bookPage: () => Number(store.get('recordsBookPage')) || 0,
    saveBookPage: (n) => store.set('recordsBookPage', n),
    daySeed: DAY,
    onCorkRead: (id) => log('cork read: ' + id),
    ajar,
    onBack: () => log('onBack -> campus'),
    onReport: () => log('onReport -> report card'),
    onAnnex: () => log('showAnnex() -> the storeroom'),   // the fake showAnnex
    reportLabel: lexT('report_card', 'Report Card'),
  });

  document.getElementById('rrdemo-tag').textContent =
    'recordsroom.demo · view=' + wanted + (wantCards ? ' panel=cards' : '')
    + ' ajar=' + (ajar ? '1' : '0') + ' visits=' + visitsParam
    + ' spread=' + spreadParam + (reduced ? ' reduced' : '') + (lite ? ' lite' : '')
    + ' stamps=' + totalStamps();

  if (!room) { log('createRecordsRoom returned null'); }

  /* ------------------------------------------------------------- the drive --
   * The room's verbs live behind its hotspots (mountBoard / mountBook /
   * openCards are private, and pressing the real button is also the honest
   * test). The wide view's rows are authored tray, board, book, [storeroom],
   * so the index is stable whether or not the door exists. */
  function press(i) {
    const hots = room && room.root ? room.root.querySelectorAll('.asc-hot') : [];
    const b = hots[i];
    if (!b) { log('no hotspot at index ' + i); return; }
    log('press ' + i + ' (' + b.getAttribute('aria-label') + ')');
    b.click();
  }

  function drive() {
    if (!room) return;
    if (wanted === 'board') press(1);
    else if (wanted === 'book') press(2);
    if (wantCards) press(0);
    try { room.fit(); } catch (e) {}
  }

  // one frame for the lazy sheets, then a beat for the plate decode
  requestAnimationFrame(() => setTimeout(drive, 80));
  // and a late refit, because the fit races the stylesheet loads
  setTimeout(() => { try { room && room.fit(); } catch (e) {} }, 600);

  window.rrRoom = room;   // a seam for the console
</script>
</body>
</html>
