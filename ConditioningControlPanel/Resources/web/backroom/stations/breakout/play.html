<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#160e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<!-- The playtest serves this page at /breakout (a rewrite), so the module imports need the real folder as base. -->
<base href="/backroom/stations/breakout/">
<link rel="icon" href="data:,">
<title>Breakout</title>
<!-- play.html - the BROWSER game (owner direction 2026-09-18: web first, phone first; the CCP cabinet is the port).
     On the playtest deploy the two phone shims stand in for the WPF host: pictures come from Scrolller through
     api/clip (the room's own picker settings, shared on this origin), fullscreen effects render in the page, and
     the spoken word plays the bundled clips. Locally (serve.mjs) the shims 404 and the page runs unhosted with the
     EMI emote GIFs, like dev.html. Query: ?sat=0.6 &still &bpm=100 &n=12 &speed=0.8 &nosub &words=a,b,c &nofs -->
<script src="/__phone-fx.js"></script>
<script src="/__phone-host.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #160e20;
    font: 13px Segoe UI, Arial, sans-serif; color: #fce5f3; -webkit-text-size-adjust: 100%; touch-action: none; }
  #root { position: fixed; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  /* Keep the whole playable field clear of the notch and home bar in either orientation. */
  #sit { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 28px; border-radius: 24px;
    background: #28172fea; color: inherit; border: 1px solid #edb1d177; font: inherit; font-size: 17px; font-weight: 600;
    letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
  #pics-btn { position: fixed; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    z-index: 30; padding: 6px 12px; border-radius: 20px; border: 1px solid #b77da247; background: #201229cc; color: #e9c2dc;
    font: inherit; font-size: 12px; opacity: .55; cursor: pointer; touch-action: manipulation; }
  #pics-btn[hidden] { display: none; }
  #pics { position: fixed; left: 50%; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 31;
    width: min(92vw, 380px); padding: 12px 14px; border-radius: 14px; background: #160e20f4; border: 1px solid #b77da247;
    display: flex; flex-direction: column; gap: 8px; }
  #pics[hidden] { display: none; }
  #pics h2 { margin: 0; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #ffcf6b; }
  #pics label { display: flex; align-items: center; gap: 6px; }
  #pics input[type="text"] { flex: 1; font: inherit; padding: 6px 8px; border-radius: 8px; background: #0c0713; color: inherit;
    border: 1px solid #b77da247; min-width: 0; }
  #pics .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #pics button { font: inherit; padding: 6px 12px; border-radius: 10px; border: 1px solid #c58bbd59; color: #fce5f3;
    background: linear-gradient(180deg, #3d2449, #2a1734 54%, #1d0f26); cursor: pointer; touch-action: manipulation; }
  #pics .note { font-size: 11px; opacity: .7; }
</style>
</head>
<body>
<div id="root"></div>
<button id="sit" type="button" hidden>Play</button>
<button id="pics-btn" type="button" hidden>Pictures</button>
<div id="pics" hidden>
  <h2>Pictures</h2>
  <div class="row">
    <label><input type="radio" name="mode" value="scrolller"> Scrolller</label>
    <label><input type="radio" name="mode" value="bundled"> Bundled</label>
  </div>
  <label><input id="subs" type="text" placeholder="r/ names, comma separated" autocapitalize="none" autocorrect="off"></label>
  <div class="row"><button id="apply" type="button">Use these</button><button id="close" type="button">Close</button></div>
  <div class="note" id="note">New pictures arrive on the next wall.</div>
</div>
<script type="module">
import { mount } from './station.js';
import { bridge, isHosted, mintId, announceReady, markInitialized } from '../../bridge.js';

const q = new URLSearchParams(location.search);
const wait = ms => new Promise(r => setTimeout(r, ms));
const coarse = matchMedia('(pointer: coarse)').matches;
const PRESET = ['DROP', 'RELAX', 'LET GO', 'SINK', 'OBEY', 'FOCUS', 'BLANK', 'SOFT', 'EMPTY', 'GOOD', 'DEEPER', 'STILL'];
const qWords = (q.get('words') || '').split(',').map(w => w.trim()).filter(Boolean);

/* ---- media: the phone host's deal when hosted, else the emotes (local) or the bundled webps ---- */
const names = ['cheer', 'giggle', 'flirt', 'adoring', 'blowkiss', 'entrancing', 'sultry', 'praise'];
let emotes = null;
async function localDeal(count) {
  if (emotes === null) emotes = await fetch('/emotes/cheer.gif', { method: 'HEAD' }).then(r => r.ok).catch(() => false);
  const url = i => emotes ? `/emotes/${names[i % names.length]}.gif` : `../slot/fallback/gif${i % 4}.webp`;
  return { seed: 918273, gifs: Array.from({ length: count }, (_, i) => ({ key: 'g' + i, url: url(i), src: 'fallback' })),
    words: (qWords.length ? qWords : PRESET).map((w, i) => ({ key: 's' + i, text: w, src: 'preset' })) };
}
async function hostDeal(count) {
  const reqId = mintId();
  const m = await bridge.request({ type: 'media-request', reqId, station: 'breakout', count }, 'media', x => x && x.reqId === reqId, 8000, null);
  if (!m || !Array.isArray(m.gifs) || !m.gifs.length) return localDeal(count);
  const words = qWords.length ? qWords.map((w, i) => ({ key: 's' + i, text: w, src: 'preset' }))
    : (Array.isArray(m.words) && m.words.length ? m.words : PRESET.slice(0, 6).map((w, i) => ({ key: 's' + i, text: w, src: 'preset' })));
  return { seed: m.seed || 1, gifs: m.gifs.slice(0, count), words };
}
const media = ({ count = 8 } = {}) => (isHosted ? hostDeal(count) : localDeal(count));

/* ---- fx: the phone shim renders the room's fullscreen effects in the page; unhosted they are only logged ---- */
function fx(fxId, symbols = [], args) {
  if (!isHosted) { console.log('[fx]', fxId, symbols, args || ''); return Promise.resolve({ fired: [], skipped: [fxId] }); }
  const token = mintId();
  return bridge.request({ type: 'fx', token, fxId, station: 'breakout', symbols, args }, 'fx-ack', m => m && m.token === token, 4000, { fired: [], skipped: [] });
}

const spFns = new Set();
let sp = 0;
const ctx = {
  root: document.getElementById('root'),
  bridge,
  request: async () => ({ ok: false, reason: 'web' }),
  fx, media,
  sp: () => sp,
  onSp: fn => { spFns.add(fn); return () => spFns.delete(fn); },
  reduced: q.has('still') || matchMedia('(prefers-reduced-motion: reduce)').matches,
  motion: q.has('still') ? 'Reduced' : 'Full', intensity: 'Normal',
  lex: (key, fallback) => fallback,
  gates: { subliminal: !q.has('nosub') },
  variant: null,
  hostBack: null,
  standUp: () => stand(),
};

/* The bridge holds every frame until init: say ready, take the host's init (the phone shim answers at once), then open the lane. */
if (isHosted) {
  await new Promise((res) => { const t = setTimeout(res, 1500); bridge.once('init', () => { clearTimeout(t); res(); }); try { announceReady(); } catch (e) { res(); } });
  markInitialized();
}

const station = await mount(ctx);
const sit = document.getElementById('sit');
async function stand() { await station.close(); sit.hidden = false; sit.focus(); }
async function open() { sit.hidden = true; await station.open(); }
sit.onclick = open;
await open();

/* ---- the phone: keep the screen awake and go fullscreen on the first touch ---- */
let armed = false;
window.addEventListener('pointerdown', () => {
  if (armed) return; armed = true;
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* noop */ }
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (coarse && !standalone && !q.has('nofs')) { try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* noop */ } }
}, { capture: true });
document.addEventListener('visibilitychange', () => { try { station.suspend(document.hidden); } catch (e) { /* noop */ } });

/* ---- the pictures sheet: the room's picker, the short version (window.__brMedia is the phone shim's) ---- */
const brMedia = window.__brMedia;
const picsBtn = document.getElementById('pics-btn'), pics = document.getElementById('pics'), note = document.getElementById('note');
if (brMedia && typeof brMedia.get === 'function') {
  picsBtn.hidden = false;
  const fill = () => {
    let cfg; try { cfg = brMedia.get(); } catch (e) { cfg = null; }
    if (!cfg) return;
    for (const r of pics.querySelectorAll('input[name=mode]')) r.checked = r.value === (cfg.mode === 'scrolller' ? 'scrolller' : 'bundled');
    document.getElementById('subs').value = (cfg.sources || []).join(', ');
    const c = cfg.counts || {};
    note.textContent = cfg.error ? cfg.error : cfg.loading ? 'Fetching pictures...' : cfg.mode === 'scrolller'
      ? `${c.clips || 0} clips, ${c.stills || 0} stills. New pictures arrive on the next wall.` : 'Bundled pictures. New pictures arrive on the next wall.';
  };
  picsBtn.onclick = () => { pics.hidden = !pics.hidden; if (!pics.hidden) fill(); };
  document.getElementById('close').onclick = () => { pics.hidden = true; };
  document.getElementById('apply').onclick = async () => {
    const mode = (pics.querySelector('input[name=mode]:checked') || {}).value || 'bundled';
    const sources = document.getElementById('subs').value.split(/[,\s]+/).map(s => s.replace(/^r\//i, '').trim()).filter(Boolean);
    note.textContent = 'Fetching pictures...';
    try { await brMedia.set(mode, mode === 'scrolller' ? sources.join(',') : null); } catch (e) { note.textContent = String(e && e.message || e); return; }
    fill();
  };
}

window.dev = { station, ctx, open, stand, get game() { return station.game; }, get audio() { return station.audio; }, get media() { return station.media; } };
</script>
</body>
</html>
